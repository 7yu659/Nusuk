name: Generate Release Keystore (One-Time Setup)

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate permanent .jks keystore and Base64 text
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_PASS" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: Please add ANDROID_KEYSTORE_PASS and ANDROID_KEY_ALIAS in GitHub Secrets first."
            exit 1
          fi
          if [ ${#ANDROID_KEYSTORE_PASS} -lt 6 ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASS must be at least 6 characters."
            exit 1
          fi

          KEY_PASS="${ANDROID_KEY_PASS:-$ANDROID_KEYSTORE_PASS}"
          mkdir -p out

          keytool -genkeypair -noprompt \
            -keystore out/nusuk-release.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$ANDROID_KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Ebrahim Khalil, O=Fynex, C=BD"

          base64 -w 0 out/nusuk-release.jks > out/ANDROID_KEYSTORE_BASE64.txt
          echo "Keystore generated successfully. Download the artifact and copy ANDROID_KEYSTORE_BASE64.txt into your ANDROID_KEYSTORE_BASE64 secret, then delete this workflow run."

      - name: Upload keystore files (download on phone, then delete run)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            out/nusuk-release.jks
            out/ANDROID_KEYSTORE_BASE64.txt
          retention-days: 1
