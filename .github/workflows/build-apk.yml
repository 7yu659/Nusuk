name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Platform 35 and Build Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate Android project, compile APK, and prepare version metadata
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -e
          MANIFEST_PATH=""
          if [ -f "AndroidManifest.xml" ]; then
            MANIFEST_PATH="./AndroidManifest.xml"
          else
            MANIFEST_PATH="$(find . -maxdepth 4 -name "AndroidManifest.xml" -not -path "./build*" -not -path "./node_modules/*" -not -path "./_unzipped/*" | head -n 1 || true)"
          fi

          if [ -z "$MANIFEST_PATH" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -name "*.zip" | head -n 1 || true)"
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting uploaded archive: $ZIP_FILE"
              mkdir -p _unzipped
              unzip -q -o "$ZIP_FILE" -d _unzipped
              MANIFEST_PATH="$(find _unzipped -maxdepth 4 -name "AndroidManifest.xml" | head -n 1 || true)"
            fi
          fi

          if [ -z "$MANIFEST_PATH" ]; then
            echo "ERROR: AndroidManifest.xml not found! Repository contents:"
            ls -la
            exit 1
          fi

          ROOT_DIR="$(cd "$(dirname "$MANIFEST_PATH")" && pwd)"
          echo "Detected Android project root: $ROOT_DIR"

          if [ ! -d "$ROOT_DIR/res" ] || [ ! -d "$ROOT_DIR/src" ]; then
            echo "ERROR: Missing 'res' or 'src' directory inside $ROOT_DIR:"
            ls -la "$ROOT_DIR"
            exit 1
          fi

          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          OUT="$GITHUB_WORKSPACE/build-out"

          mkdir -p "$OUT/gen" "$OUT/classes"
          cd "$ROOT_DIR"

          # Stamp monotonically increasing versionCode and github_build so every push triggers forced update
          BASE_VERSION_CODE="$(grep -o 'android:versionCode="[0-9]*"' AndroidManifest.xml | head -n 1 | grep -o '[0-9]*' || echo 22)"
          VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          sed -i "s|android:versionCode=\"[0-9]*\"|android:versionCode=\"${VERSION_CODE}\"|" AndroidManifest.xml

          if [ -f "res/values/strings.xml" ]; then
            sed -i "s|<string name=\"github_build\" translatable=\"false\">[^<]*</string>|<string name=\"github_build\" translatable=\"false\">${GITHUB_RUN_NUMBER}</string>|" res/values/strings.xml
            sed -i "s|<string name=\"github_repo\" translatable=\"false\">[^<]*</string>|<string name=\"github_repo\" translatable=\"false\">${GITHUB_REPOSITORY}</string>|" res/values/strings.xml
          fi

          VERSION_NAME="$(grep -o 'android:versionName="[^"]*"' AndroidManifest.xml | head -n 1 | cut -d'"' -f2 || echo 2.8)"
          TAG="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}"

          ASSET_ARG=""
          if [ -d "assets" ]; then
            ASSET_ARG="-A assets"
          fi

          "$TOOLS/aapt2" compile --dir res -o "$OUT/res.zip"
          "$TOOLS/aapt2" link --min-sdk-version 26 --target-sdk-version 35 -I "$PLATFORM" \
            --manifest AndroidManifest.xml --java "$OUT/gen" $ASSET_ARG -o "$OUT/unaligned.apk" "$OUT/res.zip"

          find "$OUT/gen" src -name "*.java" > "$OUT/sources.txt"
          javac -source 17 -target 17 -cp "$PLATFORM" -d "$OUT/classes" @"$OUT/sources.txt"
          "$TOOLS/d8" --lib "$PLATFORM" --output "$OUT" $(find "$OUT/classes" -name "*.class")
          (cd "$OUT" && zip -q unaligned.apk classes*.dex)

          "$TOOLS/zipalign" -f -p 4 "$OUT/unaligned.apk" "$OUT/aligned.apk"

          KEY_PASS="${ANDROID_KEY_PASS:-$ANDROID_KEYSTORE_PASS}"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASS" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "Signing APK with permanent release keystore from GitHub Secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$OUT/release.keystore"
            "$TOOLS/apksigner" sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks "$OUT/release.keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASS}" \
              --key-pass "pass:${KEY_PASS}" \
              --out "$OUT/nusuk-auto.apk" \
              "$OUT/aligned.apk"
          else
            echo "Permanent keystore secrets not set; using fixed publisher signing keystore so updates install cleanly without package conflicts."
            printf '%s' '' | base64 --decode > "$OUT/fallback.p12"
            "$TOOLS/apksigner" sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks "$OUT/fallback.p12" \
              --ks-type PKCS12 \
              --ks-key-alias nusuk \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUT/nusuk-auto.apk" "$OUT/aligned.apk"
          fi

          SHA256="$(sha256sum "$OUT/nusuk-auto.apk" | awk '{print $1}')"
          cat > "$OUT/version.json" <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "buildNumber": ${GITHUB_RUN_NUMBER},
            "versionName": "${VERSION_NAME}",
            "minVersionCode": 999999,
            "forceUpdate": true,
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/nusuk-auto.apk",
            "htmlUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}",
            "notes": "Important update (Build #${GITHUB_RUN_NUMBER}). Bug fixes and improvements.",
            "sha256": "${SHA256}"
          }
          EOF

          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Nusuk Auto v${VERSION_NAME} (Build #${GITHUB_RUN_NUMBER})" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusuk-auto-apk
          path: build-out/nusuk-auto.apk

      - name: Publish GitHub Release for mandatory auto-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" -y --cleanup-tag || true
          fi
          git push --delete origin "$RELEASE_TAG" >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/build-out/nusuk-auto.apk" \
            "$GITHUB_WORKSPACE/build-out/version.json" \
            --latest \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Important update (Build #${GITHUB_RUN_NUMBER}). Bug fixes and improvements."

      - name: Sync version.json fallback to repository branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- AndroidManifest.xml res/values/strings.xml || true
          cp "$GITHUB_WORKSPACE/build-out/version.json" version.json
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "Update version.json for ${RELEASE_TAG} [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi
